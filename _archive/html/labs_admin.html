<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labs Admin - Quantum Fruits</title>
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .admin-wrap { max-width: 980px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.8rem; }
        label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input, textarea, select { width: 100%; background: #090c12; color: #fff; border: 1px solid var(--glass-border); border-radius: 8px; padding: 0.65rem; font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        .row { margin-bottom: 0.8rem; }
        .btn { border: none; border-radius: 8px; padding: 0.65rem 1rem; font-weight: 700; cursor: pointer; }
        .btn-primary { background: #38bdf8; color: #001018; }
        .status { font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="admin-wrap">
    <p><a href="labs.html">&larr; Back to Labs</a></p>
    <h1>Labs Admin</h1>
    <p class="status">Local-only helper. No auth included. Use only in trusted local environment.</p>

    <div class="panel">
        <div class="row">
            <label for="labSelect">Lab Key</label>
            <select id="labSelect"></select>
        </div>
    </div>

    <form id="editForm" class="panel">
        <div class="grid">
            <div class="row"><label for="id">ID</label><input id="id" name="id" required></div>
            <div class="row"><label for="title">Title</label><input id="title" name="title" required></div>
            <div class="row"><label for="lab">Lab Link</label><input id="lab" name="lab" required></div>
            <div class="row"><label for="theory">Theory Link</label><input id="theory" name="theory"></div>
            <div class="row"><label for="python">Python Path</label><input id="python" name="python"></div>
            <div class="row"><label for="icon">Icon</label><input id="icon" name="icon"></div>
            <div class="row"><label for="badge">Badge</label><input id="badge" name="badge"></div>
            <div class="row"><label for="accent">Accent</label><input id="accent" name="accent"></div>
            <div class="row"><label for="text_color">Text Color</label><input id="text_color" name="text_color"></div>
            <div class="row"><label for="sort_order">Sort Order</label><input id="sort_order" name="sort_order" type="number"></div>
        </div>
        <div class="row">
            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <p id="status" class="status"></p>
    </form>
</div>

<script>
const state = { labs: [], currentKey: null };

function byId(id) { return document.getElementById(id); }

function setStatus(msg, isError = false) {
    const el = byId("status");
    el.textContent = msg;
    el.style.color = isError ? "#f87171" : "#34d399";
}

function fillForm(lab) {
    if (!lab) return;
    byId("id").value = lab.id || "";
    byId("title").value = lab.title || "";
    byId("lab").value = lab.lab || "";
    byId("theory").value = lab.theory || "";
    byId("python").value = lab.python || "";
    byId("icon").value = lab.icon || "";
    byId("badge").value = lab.badge || "";
    byId("accent").value = lab.accent || "";
    byId("text_color").value = lab.text_color || "";
    byId("sort_order").value = Number.isFinite(Number(lab.sort_order)) ? String(lab.sort_order) : "999";
    byId("description").value = lab.description || "";
}

function currentLab() {
    return state.labs.find((x) => x.key === state.currentKey) || null;
}

async function loadLabs() {
    const r = await fetch("../api/admin/labs_admin.php", { cache: "no-store" });
    if (!r.ok) throw new Error("Could not load labs");
    const data = await r.json();
    state.labs = Array.isArray(data.labs) ? data.labs : [];
    const select = byId("labSelect");
    select.innerHTML = "";
    state.labs.forEach((lab) => {
        const opt = document.createElement("option");
        opt.value = lab.key;
        opt.textContent = `${lab.key} - ${lab.title}`;
        select.appendChild(opt);
    });
    if (state.labs.length > 0) {
        state.currentKey = state.labs[0].key;
        select.value = state.currentKey;
        fillForm(currentLab());
    }
}

byId("labSelect").addEventListener("change", (e) => {
    state.currentKey = e.target.value;
    fillForm(currentLab());
    setStatus("");
});

byId("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = state.currentKey;
    if (!key) return;

    const payload = {
        key,
        id: byId("id").value.trim(),
        title: byId("title").value.trim(),
        lab: byId("lab").value.trim(),
        theory: byId("theory").value.trim(),
        python: byId("python").value.trim(),
        description: byId("description").value.trim(),
        icon: byId("icon").value.trim(),
        badge: byId("badge").value.trim(),
        accent: byId("accent").value.trim(),
        text_color: byId("text_color").value.trim(),
        sort_order: byId("sort_order").value.trim() || "999"
    };

    try {
        const r = await fetch("../api/admin/update_lab.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const body = await r.json();
        if (!r.ok || !body.ok) {
            throw new Error(body.message || "Save failed");
        }
        setStatus(`Saved: ${body.updated_key}`);
        await loadLabs();
        byId("labSelect").value = key;
        state.currentKey = key;
        fillForm(currentLab());
    } catch (err) {
        setStatus(err.message || "Save failed", true);
    }
});

loadLabs().catch((err) => setStatus(err.message || "Could not initialize admin UI", true));
</script>
</body>
</html>
